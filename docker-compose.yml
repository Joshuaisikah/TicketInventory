services:
  postgres:
    image: postgres:16
    container_name: ticketinventory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketinventory
    ports:
      - "5432:5432"
    volumes:
      - ticketinventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ticketinventory-data:
